# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Pause for missing information or explicit action confirmation. Use text for a missing asset/employee ID; never guess an ID from a device type, person name, or department. Use choice with the supported enum values when a supplied environment is ambiguous. Use yes_no to present and confirm a ticket payload; derive its summary from the stated symptom rather than asking for information already supplied. Wait for the answer before dependent tools."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Read shared-service status for one service/environment. This does not diagnose an individual device. Use production when no environment is supplied; preserve explicit staging. If the user supplies an unclear environment label, clarify with response_type=choice and options=[production, staging] instead of mapping it by guesswork. For multiple requested environments, call once per environment."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], description: "Use the explicitly named supported environment, or carry it from context. Only an omitted environment defaults to production. An unsupported or informal environment label is ambiguous, not a synonym for staging: do not call this tool until clarify(choice, options=[production, staging]) resolves it."}
      required: [service, environment]

  - name: inspect_device
    description: "Read the inventory and diagnostic snapshot of one known asset. Requires an actual asset ID supplied by the user or a trusted tool result; never use an employee ID, department, or generic device name. If the asset ID is missing, call clarify with response_type=text first. Only inspect when device diagnostics or inventory are requested, not merely to list an employee's assigned assets."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Actual company asset identifier from user context or trusted inventory; never infer or substitute an employee identifier."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], description: "Explicit diagnostic scope: use vpn for VPN symptoms including VPN certificates, network for Wi-Fi/connectivity, security for endpoint protection/encryption, hardware for physical components, software for installed apps. Apply the symptom context even when the request simply says inspect the device alongside other tools. Use all only for an overall check or when no focused symptom/check is given. Honor the latest explicit scope."}
      required: [asset_id, check]

  - name: lookup_user
    description: "Read an employee account and assigned asset IDs by employee ID. This tool alone answers which devices are assigned; add inspect_device only for a separate diagnostic request with a known asset ID. If employee ID is absent, call clarify with response_type=text; a name or department is not an employee ID."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Actual employee identifier supplied in context, not a name, team, department, or asset ID."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Write a local ticket only after explicit user approval of its exact summary, priority, and asset. An initial creation request is not approval. First present those fields using clarify with response_type=yes_no and wait; never call this tool alongside the question. Derive a concise summary from the user's stated issue. Payload changes invalidate earlier approval."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
